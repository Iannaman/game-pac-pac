<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050915"><title>Manuale PAC PAC</title><style>:root{color-scheme:dark;--cyan:#58efff;--gold:#ffe176;--ink:#050915}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#193453,var(--ink) 50%);color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:38px 20px 22px;text-align:center}h1{font-size:clamp(35px,8vw,70px);color:var(--gold);margin:0}header p{color:#b8d3e6}main{width:min(960px,calc(100% - 28px));margin:auto;padding-bottom:50px}.controls{position:sticky;top:0;background:#050915e8;backdrop-filter:blur(10px);padding:10px;display:flex;gap:8px;z-index:2}.controls input{flex:1;background:#0a1728;color:white;border:1px solid #55728f;border-radius:10px;padding:12px}.controls a{background:var(--cyan);color:#04111b;text-decoration:none;font-weight:800;border-radius:10px;padding:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}section{background:#071426;border:1px solid #385270;border-radius:15px;padding:16px}h2{font-size:18px;color:var(--gold);margin:0 0 7px}p{line-height:1.55;color:#bed0e2;margin:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.controls{flex-direction:column}}@media print{body{background:white;color:black}.controls{display:none}section{break-inside:avoid;border-color:#aaa}h1,h2,p{color:black}}</style></head><body><header><div>PAC PAC 4.1</div><h1>Manuale di gioco</h1><p>Comandi, modalità, punteggio, multiplayer e Level Studio.</p></header><main><div class="controls"><input id="q" type="search" placeholder="Cerca un argomento" aria-label="Cerca un argomento"><a href="./index.html">Torna al gioco</a></div><div id="manual" class="grid"></div></main><script src="./src/ui/manual-410.js"></script><script>const body=document.getElementById('manual'),q=document.getElementById('q');function draw(v=''){const t=v.toLowerCase();body.innerHTML=PacPacManual410.sections.filter(x=>!t||x.join(' ').toLowerCase().includes(t)).map(x=>`<section><h2>${x[0]}</h2><p>${x[1]}</p></section>`).join('')||'<p>Nessun argomento trovato.</p>'}q.addEventListener('input',()=>draw(q.value));draw();</script></body></html>
