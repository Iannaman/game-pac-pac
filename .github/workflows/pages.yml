name: Test and deploy PAC PAC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node tests/check.cjs && node tests/arcade_check.cjs && node tests/retention_check.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp multiplayer-config.js public/multiplayer-config.js
          cp social-230.js social-230.css arcade-240.js arcade-240.css retention-250.js retention-250.css public/
          mkdir -p public/vendor
          cp vendor/qrcode-core.js public/vendor/qrcode-core.js
          if [ -d audio ]; then cp -R audio public/audio; fi
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
